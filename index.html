<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confere Aí</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   <header>
        <h1>Confere Aí</h1>
        <nav>
            <a href="#">Início</a>
        </nav>
    </header>

    <main>
        <h2>Descubra a verdade passando o mouse</h2>
        
   
        <div class="lista-cartoes">
            

            <div class="cartao">
                <div class="giro">
                    
                    <div class="frente">
                        <img src="pinguim.jpg" alt="Pinguim">
                        <p>Pinguins conseguem voar como pássaros!</p>
                    </div>
                    
                    <div class="verso">
                        <img src="pinguim.jpg" alt="Pinguim">
                        <p>Pinguins não voam, mas são excelentes nadadores.</p>
                    </div>
                    
                </div>
            </div>

         
            <div class="cartao">
                <div class="giro">
                    
                    <div class="frente">
                        <img src="gato.jpg" alt="Gato">
                        <p>Gatos enxergam na escuridão total?</p>
                    </div>
                    
                    <div class="verso">
                        <img src="gato.jpg" alt="Gato">
                        <p>Não na escuridão total, mas enxergam muito bem com pouca luz!</p>
                    </div>
                    
                </div>
            </div>

        </div>
    </main>

  <footer>
        <p>&copy; Confere Aí - Todos os direitos reservados</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>

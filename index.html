<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confere Aí</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabecalho">
        <h1>Confere Aí</h1>
        <nav>
            <a href="#" style="color: #fff; text-decoration: none;">Início</a>
        </nav>
    </header>

    <main>
        <h2>Descubra a verdade passando o mouse</h2>
        
        <article class="cartao">
            <div class="cartao-interno">
                
                <div class="cartao-frente">
                    <div class="cartao-imagem">
                        <img src="https://static.nationalgeographicbrasil.com/files/styles/image_3200/public/mm1012723121410486.jpg?w=1900&h=2849" alt="Pinguim">
                    </div>
                    <p>Pinguins conseguem voar como pássaros!</p>
                </div>

                <div class="cartao-verso">
                    <div class="cartao-imagem">
                        <img src="https://static.nationalgeographicbrasil.com/files/styles/image_3200/public/mm1012723121410486.jpg?w=1900&h=2849" alt="Pinguim">
                    </div>
                    <p>Pinguins não voam, mas são excelentes nadadores.</p>
                </div>

            </div>
        </article>
    </main>

    <footer>
        <p>&copy; Confere Aí - Todos os direitos reservados</p>
    </footer>

    <script src="script.js"></script>

</html>
